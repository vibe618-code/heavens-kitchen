    /* ===== Admin Panel Styles ===== */
    .admin-panel-root {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #1E1E24;
      color: #e8e4df;
      font-family: 'Inter', system-ui, sans-serif;

    .admin-panel-root .ap-animate-fade { animation: ap-fadeIn 0.5s ease-out forwards; }
    @keyframes ap-fadeIn { 0%{opacity:0;transform:translateY(8px)} 100%{opacity:1;transform:translateY(0)} }
    @keyframes ap-slideUp { 0%{opacity:0;transform:translateY(20px)} 100%{opacity:1;transform:translateY(0)} }

    .admin-panel-root ::-webkit-scrollbar { width:6px;height:6px }
    .admin-panel-root ::-webkit-scrollbar-track { background:#2a2a30;border-radius:8px }
    .admin-panel-root ::-webkit-scrollbar-thumb { background:#C9A96E;border-radius:8px }

    .admin-panel-root .ap-spinner {

      display:inline-block;
      vertical-align:middle;
    }
    @keyframes ap-spin { to{transform:rotate(360deg)} }

    .admin-panel-root input,
    .admin-panel-root select,
    .admin-panel-root textarea {
      background:#2a2a30;
      border:1px solid rgba(201,169,110,0.15);

    .admin-panel-root .ap-btn-gold {
      background:#C9A96E;color:#1E1E24;font-weight:600;

      .admin-panel-root .ap-main { padding:16px }

    .admin-panel-root .ap-nav-link {
      display:flex;align-items:center;gap:12px;padding:10px 16px;

    .admin-panel-root .ap-modal-bg {
      position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);

      animation:ap-fadeIn 0.25s ease-out;
    }
    .admin-panel-root .ap-modal-box {
      background:#1E1E24;border:1px solid rgba(201,169,110,0.12);
      border-radius:20px;padding:28px 32px;max-width:520px;width:100%;

    .admin-panel-root .ap-confirm-bg {
      position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
      display:flex;align-items:center;justify-content:center;z-index:350;padding:20px;
      animation:ap-fadeIn 0.2s ease-out;
    }
    .admin-panel-root .ap-confirm-box {
      background:#1E1E24;border:1px solid rgba(201,169,110,0.15);
      border-radius:16px;padding:24px 28px;max-width:380px;width:100%;
      animation:ap-scaleIn 0.25s ease-out;text-align:center;

    .admin-panel-root .ap-toast-wrap {
      position:fixed;top:20px;right:20px;z-index:400;
      display:flex;flex-direction:column;gap:8px;pointer-events:none;

      background:#2a2a30;border:1px solid rgba(201,169,110,0.2);

<body>
  <div id="app"></div>
  <div id="admin-root"></div>

  <script>
    'use strict';

    /* ========================================
       Utility Helpers
    ======================================== */
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
    const money = n => `₹${Number(n || 0).toFixed(2)}`;
    const safeId = () => `ord_${Date.now()}_${Math.random().toString(16).slice(2, 8)}`;

    /* ========================================
       localStorage Wrapper (with fallback)
    ======================================== */
    const memoryStore = {};
    const storage = {
      getItem(key) {
        try { return window.localStorage.getItem(key); }
        catch { return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null; }
      },
      setItem(key, value) {
        try { window.localStorage.setItem(key, value); }
        catch { memoryStore[key] = String(value); }
      },
      removeItem(key) {
        try { window.localStorage.removeItem(key); }
        catch { delete memoryStore[key]; }
      }
    };
    const getLocal = (key, fallback) => {
      try { const v = storage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    };
    const setLocal = (key, value) => storage.setItem(key, JSON.stringify(value));

    /* ========================================
       Image Assets
    ======================================== */
    const IMG = {
      Mojito:'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600&q=80',
      Milkshake:'https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=600&q=80',
      Fries:'https://images.unsplash.com/photo-1585109649139-366815a0d713?w=600&q=80',
      Special:'https://images.unsplash.com/photo-1599974579688-8dbdd335c77f?w=600&q=80',
      Burger:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&q=80',
      Sandwich:'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=600&q=80',
      Wrap:'https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=600&q=80',
      Pizza:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600&q=80',
      Sides:'https://images.unsplash.com/photo-1562967916-eb82221dfb92?w=600&q=80'
    };

    /* ========================================
       Build Menu
    ======================================== */
    function buildMenu() {
      let id = 1;
      const items = [];
      const add = (category, title, price, image) => items.push({ id: id++, category, title, price, image });

      ['Blue Curacao','Watermelon','Strawberry','Virgin'].forEach(n => add('Mojito', `${n} Mojito`, 70, IMG.Mojito));
      [['Vanilla',90],['Strawberry',100],['Butter Scotch',100],['Black Current',100],['Chocolate',110],['Oreo',120]].forEach(([n,p]) => add('Milkshake', `${n} Milkshake`, p, IMG.Milkshake));

      add('Fries','Salted Fries (Regular)',70,IMG.Fries);
      add('Fries','Salted Fries (Large)',100,IMG.Fries);
      add('Fries','Peri Peri Fries (Regular)',90,IMG.Fries);
      add('Fries','Peri Peri Fries (Large)',130,IMG.Fries);

      [['Chicken Loaded Fries',160],['Chicken Cheesy Fries',180],['Full Chicken Loaded Fries',200],['Special Loaded Chicken',250]].forEach(([n,p]) => add('Special Fries', n, p, IMG.Special));
      [['Chicken Burger',120],['Chicken Nuggets Burger',120],['Chicken Cheesy Burger',130],['Chicken Zinger Burger',130],['Chicken Loaded Burger',150],['Chicken Cheesy Loaded',190]].forEach(([n,p]) => add('Burger', n, p, IMG.Burger));
      [['Veg Sandwich',70],['Veg Cheese Sandwich',90],['Chicken Sandwich',90],['BBQ Chicken Sandwich',100],['Chicken Cheesy Sandwich',110],['Heavens Sandwich',120]].forEach(([n,p]) => add('Sandwich', n, p, IMG.Sandwich));
      [['Chicken Wrap',120],['Chicken BBQ Wrap',120],['Chicken Tandoori Wrap',120],['Chicken Nuggets Wrap',130],['Chicken Cheesy Wrap',130],['Chicken Zinger Wrap',130],['Chicken Loaded Wrap',160]].forEach(([n,p]) => add('Wrap', n, p, IMG.Wrap));
      [['Veg Pizza 8"',170],['Margherita 8"',170],['Veg Heavens Pizza 8"',190],['Chicken Pizza 8"',190],['BBQ Chicken Pizza 8"',200],['Cheesy Chicken Pizza 8"',230],['Chicken Heavens Pizza 8"',240]].forEach(([n,p]) => add('Pizza', n, p, IMG.Pizza));
      [['Chicken Nuggets (8 Pcs)',100],['Chicken Nuggets (15 Pcs)',170],['Chicken Popcorn (15 Pcs)',100],['Chicken Strips (5 Pcs)',200]].forEach(([n,p]) => add('Sliders / Sides', n, p, IMG.Sides));

      return items;
    }

    const menu = buildMenu();
    const specialNames = new Set(['Chicken Loaded Fries','Chicken Cheesy Fries','Full Chicken Loaded Fries','Special Loaded Chicken']);
        const categories = ['Sandwich','Burger','Fries','Pizza','Wrap','Sliders / Sides','Milkshake','Mojito'];
    const SAVED_ADDRESSES = [
      { id: 'addr1', label: 'Home', address: '123, MG Road, Indiranagar, Bangalore 560038', eta: '25-35 mins' },
      { id: 'addr2', label: 'Work', address: '456, Koramangala 5th Block, Bangalore 560034', eta: '30-40 mins' }
    ];
    const PLATFORM_FEE = 10;
    const TAX_RATE = 0.05;
    const MAX_LOYALTY_REDEEM = 50;
    const MOCK_DISCOUNT_CODES = { 'SAVE10': 10, 'WELCOME': 15, 'HEAVEN20': 20 };

    /* ========================================
       App State
    ======================================== */
    const state = {
      route: 'site',
      dark: getLocal('hk_dark', false),
      userId: storage.getItem('hk_current_user') || null,
      cart: [],
      filter: '',
      modal: null,
      sidebar: false,
      cartOpen: false,
      checkout: false,
      orderDone: null,
      authMode: 'login',
      fulfillment: 'delivery',
      paymentMode: 'online',
      payment: '',
      redeem: 0,
      discountCode: '',
      discountPercent: 0,
      selectedAddressId: 'addr1',
      addressSheetOpen: false
    };
    window.state = state;

    /* ========================================
       Data Accessors
    ======================================== */
    function currentUser() { return getLocal('hk_users', {})[state.userId] || null; }
    function userName() { return currentUser()?.name || (state.userId === 'guest' ? 'Guest' : ''); }
    function coins() { return currentUser()?.coins || 0; }
    function favourites() { return getLocal(`hk_fav_${state.userId || 'guest'}`, []); }
    function availability() { return getLocal('hk_availability', {}); }
    function visibleMenu() {
      const av = availability();
      return menu.filter(d => !specialNames.has(d.title) && av[d.id] !== false && (!state.filter || d.category === state.filter));
    }
    function allOrders() { return getLocal('hk_orders', []); }
    function userOrders() { return allOrders().filter(o => o.userId === state.userId); }
    function cartCount() { return state.cart.reduce((s, i) => s + i.qty, 0); }
    function itemTotal() { return state.cart.reduce((s, i) => s + i.price * i.qty, 0); }
    function totals() {
  const item = itemTotal();
  const delivery = item >= 300 || state.fulfillment === 'pickup' ? 0 : 40;
  const platformFee = PLATFORM_FEE;
  const taxable = item + delivery + platformFee;
  const tax = Math.round(taxable * TAX_RATE);
  const redeem = Math.min(Number(state.redeem || 0), Math.min(coins(), MAX_LOYALTY_REDEEM));
  const discountPercent = Number(state.discountPercent || 0);
  const percentDiscount = Math.round(item * discountPercent / 100);
  const totalDiscount = redeem + percentDiscount;
  const grand = Math.max(0, taxable + tax - totalDiscount);
  return { item, delivery, platformFee, tax, redeem, discountPercent, percentDiscount, totalDiscount, grand };
}

/* ========================================
       Init & Helpers
    ======================================== */
    function init() {
      state.fulfillment = 'delivery';
      state.paymentMode = 'online';
      state.payment = '';
      state.redeem = 0;
      if (!state.userId) state.route = 'auth';
      applyTheme();
      render();
    }

    function applyTheme() {
      document.documentElement.classList.toggle('dark', state.dark);
      setLocal('hk_dark', state.dark);
    }

    function rerender() { render(); }
    window.rerender = rerender;

    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    function imgFallback(ev) {
      ev.target.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="100%" height="100%" fill="#eadcc6"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#8b1e2d" font-family="serif" font-size="32">Heavenskitchen</text></svg>`);
    }
    window.imgFallback = imgFallback;

    function greeting() {
      const h = new Date().getHours();
      return h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
    }

    /* ========================================
       Main Render
    ======================================== */
    function render() {
      const app = $('#app');
      // Hide admin root when not in admin mode
      const adminRoot = $('#admin-root');

      if (state.route === 'admin') {
        app.innerHTML = '';
        adminRoot.style.display = 'block';
        renderAdminPanel();
        return;
      } else {
        adminRoot.style.display = 'none';
        adminRoot.innerHTML = '';
      }

      if (state.route === 'auth') { app.innerHTML = authHTML(); return; }
      if (state.orderDone) { app.innerHTML = successHTML(state.orderDone); animateSuccess(); return; }
      if (state.checkout) { app.innerHTML = checkoutHTML(); return; }
      app.innerHTML = siteHTML();
      $$('.dish img, .cart-row img').forEach(img => img.onerror = imgFallback);
    }

    /* ========================================
       Auth
    ======================================== */
    function authHTML() {
      const signup = state.authMode === 'signup';
      return `<main class="hero"><div class="hero-content card" style="width:min(440px,92vw);color:var(--text);padding:28px;text-align:left">
        <h1 class="display" style="font-size:36px;margin:0 0 16px;text-align:center">${signup ? 'Create Account' : 'Welcome Back'}<span style="color:var(--red2)">.</span></h1>
        <form onsubmit="return authSubmit(event)">
          ${signup ? '<div class="field"><label>Name *</label><input name="name" required></div>' : ''}
          <div class="field"><label>Phone *</label><input name="phone" type="tel" required></div>
          ${signup ? '<div class="field"><label>Address *</label><textarea name="address" required></textarea></div>' : ''}
          <div class="field"><label>Password *</label><input name="password" type="password" minlength="6" required></div>
          <button class="btn" style="width:100%">${signup ? 'Sign Up' : 'Login'}</button>
        </form>
        <button class="btn secondary" style="width:100%;margin-top:12px" onclick="toggleAuthMode()">${signup ? 'Already have an account? Log in' : "Don't have an account? Sign up"}</button>
        <button class="btn secondary" style="width:100%;margin-top:12px" onclick="skipLogin()">Skip for now</button>
      </div></main>`;
    }

    window.toggleAuthMode = () => { state.authMode = state.authMode === 'signup' ? 'login' : 'signup'; rerender(); };
    window.skipLogin = () => { state.userId = 'guest'; state.route = 'site'; rerender(); };
    window.authSubmit = ev => {
      ev.preventDefault();
      const f = Object.fromEntries(new FormData(ev.target));
      const users = getLocal('hk_users', {});
      if (state.authMode === 'signup') {
        if (users[f.phone]) return toast('Phone already registered.');
        users[f.phone] = { name: f.name.trim(), address: f.address.trim(), password: f.password, coins: 0 };
        setLocal('hk_users', users);
        storage.setItem('hk_current_user', f.phone);
        state.userId = f.phone;
      } else {
        if (!users[f.phone] || users[f.phone].password !== f.password) return toast('Invalid phone or password.');
        storage.setItem('hk_current_user', f.phone);
        state.userId = f.phone;
      }
      state.route = 'site';
      state.authMode = 'login';
      rerender();
      return false;
    };

    /* ========================================
       Site (Main Customer View)
    ======================================== */

      const fav = favourites();

        ${state.sidebar ? sidebarHTML() : ''}${state.cartOpen ? cartHTML() : ''}${state.modal ? customizeHTML(state.modal) : ''}`;

      function dishCard(d) {
        return `<article class="dish card"><img src="${d.image}" alt="${d.title}" onerror="imgFallback(event)"><div class="dish-body"><h3>${d.title}</h3><p class="price">₹${d.price}</p><div class="dish-actions"><button class="heart ${fav.includes(d.id) ? 'active' : ''}" onclick="toggleFav(${d.id})">♥</button><button class="btn small" onclick="openCustomize(${d.id})">Add to Cart</button></div></div></article>`;
      }
    }

    function headerHTML() {
      return `<header class="topbar glass"><div class="container row"><div style="display:flex;align-items:center;gap:12px"><button class="iconbtn" onclick="state.sidebar=true;rerender()"><span class="hamb"><i></i><i></i><i></i></span></button><a class="brand" href="#hero">HEAVENSKITCHEN<span>.</span></a></div><div style="display:flex;align-items:center;gap:12px"><span class="muted" style="font-size:14px">${greeting()}, ${userName()}</span><button class="iconbtn" style="position:relative" onclick="state.cartOpen=true;rerender()">🛒${cartCount() ? `<span class="cart-count">${cartCount()}</span>` : ''}</button></div></div></header>`;

    window.setFilter = c => { state.filter = state.filter === c ? '' : c; rerender(); setTimeout(() => location.hash = 'menu', 0); };
    window.openCustomize = id => { state.modal = menu.find(d => d.id === id); rerender(); };
    window.toggleFav = id => { const key = `hk_fav_${state.userId || 'guest'}`; const fav = favourites(); setLocal(key, fav.includes(id) ? fav.filter(x => x !== id) : [...fav, id]); rerender(); };

    /* ========================================
       Customize Modal
    ======================================== */
    function customizeHTML(d) {
      return `<div class="modal-bg" onclick="state.modal=null;rerender()"></div><div class="modal"><h2 class="display" style="margin-top:0">${d.title}</h2><p class="price" style="font-size:22px">₹${d.price}</p><form onsubmit="return addCustomized(event,${d.id})"><label class="switch"><span>Extra Cheese (+₹20)</span><input type="checkbox" name="cheese" value="20"></label><label class="switch"><span>Extra Sauce (+₹15)</span><input type="checkbox" name="sauce" value="15"></label><label class="switch"><span>No Onion</span><input type="checkbox" name="noOnion" value="0"></label><button class="btn" style="width:100%;margin-top:14px">Add to Cart</button><button type="button" class="btn secondary" style="width:100%;margin-top:10px" onclick="state.modal=null;rerender()">Cancel</button></form></div>`;
    }

    window.addCustomized = (ev, id) => {
      ev.preventDefault();
      const d = menu.find(x => x.id === id);
      const data = new FormData(ev.target);
      const extras = [];
      let price = d.price;
      if (data.has('cheese')) { extras.push('Extra Cheese'); price += 20; }
      if (data.has('sauce')) { extras.push('Extra Sauce'); price += 15; }
      if (data.has('noOnion')) extras.push('No Onion');
      const custom = extras.join(', ') || 'Standard';
      const found = state.cart.find(i => i.id === id && i.custom === custom);
      if (found) found.qty++; else state.cart.push({ id, name: d.title, image: d.image, price, qty: 1, custom });

      toast(`${d.title} added to cart`);

      }

};

window.setFulfillment = mode => { state.fulfillment = mode; state.payment = ''; rerender(); };
window.setPaymentMode = mode => { state.paymentMode = mode; state.payment = ''; rerender(); };
window.setAddress = id => { state.selectedAddressId = id; state.addressSheetOpen = false; rerender(); };
window.applyDiscountCode = () => {
  const code = state.discountCode.trim().toUpperCase();
  const codes = { ...MOCK_DISCOUNT_CODES, ...getLocal('hk_discounts', {}) };
  const pct = codes[code];
  if (pct) {
    state.discountPercent = pct;
    toast(`✅ Discount code applied: ${pct}% off`);
  } else {
    state.discountPercent = 0;
    toast('❌ Invalid discount code');
  }
  rerender();
};
window.removeDiscountCode = () => {
  state.discountCode = '';
  state.discountPercent = 0;
  rerender();
};
window.handleCheckoutSubmit = ev => {
  ev.preventDefault();
  if (!state.payment || state.cart.length === 0) return false;
  placeOrder();
  return false;
};

window.placeOrder = () => {
  const t = totals();
  const selectedAddress = SAVED_ADDRESSES.find(a => a.id === state.selectedAddressId) || SAVED_ADDRESSES[0];
  const order = {
    id: safeId(),
    userId: state.userId,
    items: state.cart.map(i => ({ ...i })),
    itemTotal: t.item,
    grand: t.grand,
    redeemed: t.redeem,
    discountPercent: t.discountPercent,
    discountAmount: t.percentDiscount,
    status: 'pending',
    fulfillment: state.fulfillment,
    paymentMode: state.paymentMode,
    paymentMethod: state.payment,
    addressId: state.fulfillment === 'delivery' ? state.selectedAddressId : null,
    addressLabel: state.fulfillment === 'delivery' ? selectedAddress.label : "Heaven's Kitchen",
    eta: state.fulfillment === 'pickup' ? '15-20 mins' : '25-35 mins',
    createdAt: new Date().toISOString()
  };
  const orders = allOrders();
  orders.push(order);
  setLocal('hk_orders', orders);
  const users = getLocal('hk_users', {});
  if (users[state.userId]) {
    users[state.userId].coins = Math.max(0, (users[state.userId].coins || 0) - t.redeem) + 10;
    setLocal('hk_users', users);
  }
  state.cart = [];
  state.checkout = false;
  state.orderDone = order;
  state.redeem = 0;
  state.discountPercent = 0;
  state.discountCode = '';
  state.payment = '';
  state.paymentMode = 'online';
  state.fulfillment = 'delivery';
  rerender();
};

function animateSuccess() {
  const el = document.getElementById('orderStatusText');
  if (!el) return;
  const stages = ['Confirmed', 'Preparing', 'Out for delivery', 'Delivered'];
  const duration = 60000;
  const start = Date.now();
  const interval = setInterval(() => {
    const progress = Math.min(1, (Date.now() - start) / duration);
    const idx = Math.min(stages.length - 1, Math.floor(progress * stages.length));
    const before = stages.slice(0, idx).map(s => `<span style="opacity:.5">${s}</span>`).join(' → ');
    const current = `<span style="color:var(--green);font-weight:800">${stages[idx]}</span>`;
    const after = stages.slice(idx + 1).map(s => `<span style="opacity:.5">${s}</span>`).join(' → ');
    const parts = [before, current, after].filter(Boolean);
    el.innerHTML = parts.join(' → ');
    if (progress >= 1) clearInterval(interval);
  }, 100);
}

/* ========================================
       Enter Admin — switches route

    window.enterAdmin = () => {
      state.route = 'admin';
      rerender();
    };

    /* ========================================
       ███████████████████████████████████████
       ██   ADMIN PANEL (Self-contained)   ██
       ███████████████████████████████████████
    ======================================== */

    const adminState = {
      authed: false,
      passHash: getLocal('hk_admin_pass_hash', ''),
      tab: 'dashboard',
      dishSearch: '',
      orderSearch: '',
      editingDish: null,
      showAddForm: false,
      confirmAction: null,
      newDish: { title: '', category: 'Sandwich', price: 100, dietary: 'non-veg', image: '', inStock: true },
      toasts: [],
      toastCounter: 0,
      loaderBg: getLocal('hk_settings', {}).loaderBg || '',
      storyImg: getLocal('hk_settings', {}).storyImg || '',
      newCode: '',
      newPercent: '',
      uploadingLoader: false,
      uploadingStory: false,
      orderFilter: 'all',
      // Change password
      cpCurrent: '',
      cpNew: '',
      cpConfirm: '',
      cpSaving: false,
      // Setup
      setupPass: '',
      loginPass: '',
      loginError: '',
      loggingIn: false,
    };

    // Admin categories (includes Special Fries)
    const adminCategories = ['Sandwich', 'Burger', 'Fries', 'Special Fries', 'Pizza', 'Wrap', 'Sliders / Sides', 'Milkshake', 'Mojito'];

    /* --- Password hashing --- */
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password + '_hk_salt_2024');
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /* --- Admin toast --- */
    function adminToast(message, type = 'info', duration = 3000) {
      const id = ++adminState.toastCounter;
      adminState.toasts.push({ id, message, type });
      renderAdminPanel();
      setTimeout(() => {
        adminState.toasts = adminState.toasts.filter(t => t.id !== id);
        renderAdminPanel();
      }, duration);
    }

    /* --- Admin data accessors (reads from same localStorage keys as customer site) --- */
    function adminGetDishes() { return getLocal('hk_admin_dishes', menu.map((d, i) => ({ ...d, dietary: getDefaultDietary(d), inStock: availability()[d.id] !== false }))); }
    function adminSetDishes(dishes) { setLocal('hk_admin_dishes', dishes); syncAvailability(dishes); }
    function adminGetOrders() { return allOrders(); }
    function adminSetOrders(orders) { setLocal('hk_orders', orders); }
    function adminGetDiscounts() { return getLocal('hk_discounts', {}); }
    function adminSetDiscounts(codes) { setLocal('hk_discounts', codes); }
    function adminGetSettings() { return getLocal('hk_settings', { loaderBg: '', storyImg: '' }); }

    // Sync admin dish availability back to hk_availability for customer site
    function syncAvailability(dishes) {
      const av = {};
      dishes.forEach(d => { if (!d.inStock) av[d.id] = false; });
      setLocal('hk_availability', av);
    }

    function getDefaultDietary(d) {
      const vegCats = ['Mojito', 'Milkshake', 'Fries'];
      const vegNames = ['Veg Sandwich', 'Veg Cheese Sandwich', 'Veg Pizza 8"', 'Margherita 8"', 'Veg Heavens Pizza 8"'];
      if (vegCats.includes(d.category)) return 'veg';
      if (vegNames.includes(d.title)) return 'veg';
      return 'non-veg';
    }

    /* --- Initialize admin dishes if not yet saved --- */
    function ensureAdminDishes() {
      if (!storage.getItem('hk_admin_dishes')) {
        const av = availability();
        const dishes = menu.map(d => ({
          ...d,
          dietary: getDefaultDietary(d),
          inStock: av[d.id] !== false
        }));
        adminSetDishes(dishes);
      }
    }

    /* ========================================
       Admin Panel Renderer
    ======================================== */
    function renderAdminPanel() {
      const root = $('#admin-root');
      if (!root) return;
      ensureAdminDishes();

      if (!adminState.authed) {
        root.innerHTML = adminLoginScreen();
        return;
      }

      root.innerHTML = adminDashboardScreen();
    }

    /* --- Admin Login Screen --- */
    function adminLoginScreen() {
      const isSetup = !adminState.passHash;
      return `<div class="admin-panel-root" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">
        <div class="ap-glass ap-animate-scale" style="border-radius:20px;padding:32px;width:100%;max-width:380px;border-color:rgba(201,169,110,0.1)">
          <div style="text-align:center;margin-bottom:24px">
            <div style="width:56px;height:56px;border-radius:16px;background:rgba(201,169,110,0.1);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px">
              <i class="fas fa-utensils" style="color:#C9A96E;font-size:1.2rem"></i>
            </div>
            <h1 class="font-display" style="font-size:1.8rem;font-weight:700;color:#C9A96E;margin:0">HK<span style="color:#FFF5E6">Admin</span></h1>
            <p style="color:#6a6a72;font-size:0.85rem;margin-top:8px">${isSetup ? 'Create a password to secure your admin panel' : 'Enter your password to continue'}</p>
          </div>
          ${adminState.loginError ? `<div style="margin-bottom:14px;padding:10px 14px;border-radius:10px;font-size:0.85rem;background:rgba(183,109,104,0.1);border:1px solid rgba(183,109,104,0.2);color:#B76D68"><i class="fas fa-exclamation-circle" style="margin-right:6px"></i>${adminState.loginError}</div>` : ''}
          ${isSetup ? `
            <div style="margin-bottom:12px">
              <input type="password" placeholder="New password (min 4 chars)" value="${esc(adminState.setupPass)}" oninput="adminState.setupPass=this.value;adminState.loginError=''" onkeydown="if(event.key==='Enter')adminSetupSubmit()" style="text-align:center" />
            </div>
            <button class="ap-btn-gold" style="width:100%" onclick="adminSetupSubmit()" ${adminState.loggingIn ? 'disabled' : ''}>
              ${adminState.loggingIn ? '<span class="ap-spinner" style="width:16px;height:16px;margin-right:8px"></span>Setting up...' : 'Set Password & Enter'}
            </button>
          ` : `
            <div style="margin-bottom:12px">
              <input type="password" placeholder="Enter password" value="${esc(adminState.loginPass)}" oninput="adminState.loginPass=this.value;adminState.loginError=''" onkeydown="if(event.key==='Enter')adminLoginSubmit()" style="text-align:center" />
            </div>
            <button class="ap-btn-gold" style="width:100%" onclick="adminLoginSubmit()" ${adminState.loggingIn ? 'disabled' : ''}>
              ${adminState.loggingIn ? '<span class="ap-spinner" style="width:16px;height:16px;margin-right:8px"></span>Verifying...' : '<i class="fas fa-lock" style="margin-right:8px"></i>Login'}
            </button>
          `}
          <button class="ap-btn-ghost" style="width:100%;margin-top:10px" onclick="adminBackToSite()">← Back to Site</button>
          <p style="color:#4a4a52;font-size:0.7rem;text-align:center;margin-top:18px"><i class="fas fa-shield-alt" style="margin-right:4px"></i>Secured · Local storage · Offline ready</p>
        </div>
        ${adminToastsHTML()}
      </div>`;
    }

    // HTML escape helper
    function esc(str) { return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    window.adminSetupSubmit = async () => {
      if (adminState.setupPass.length < 4) { adminState.loginError = 'Password must be at least 4 characters.'; renderAdminPanel(); return; }
      adminState.loggingIn = true; renderAdminPanel();
      const hash = await hashPassword(adminState.setupPass);
      setLocal('hk_admin_pass_hash', hash);
      adminState.passHash = hash;
      adminState.authed = true;
      adminState.loggingIn = false;
      adminState.setupPass = '';
      renderAdminPanel();
    };

    window.adminLoginSubmit = async () => {
      if (!adminState.loginPass) { adminState.loginError = 'Please enter your password.'; renderAdminPanel(); return; }
      adminState.loggingIn = true; adminState.loginError = ''; renderAdminPanel();
      const hash = await hashPassword(adminState.loginPass);
      if (hash === adminState.passHash) {
        adminState.authed = true;
        adminState.loginError = '';
      } else {
        adminState.loginError = 'Incorrect password. Try again.';

            orders.slice(-5).reverse().map(o => `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;border-bottom:1px solid rgba(201,169,110,0.05)">

    /* ===== DISHES TAB ===== */
    function adminDishesTab() {
      const dishes = adminGetDishes();

            <div style="flex:1;min-width:0">

                <span class="ap-badge ${d.dietary === 'veg' ? 'ap-badge-green' : 'ap-badge-rose'}">${d.dietary || 'non-veg'}</span>
                <button style="font-size:0.75rem;background:none;border:none;cursor:pointer;color:${d.inStock ? '#A3B5A8' : '#B76D68'}" onclick="adminToggleStock(${d.id})">${d.inStock ? '✅ In Stock' : '⛔ Sold Out'}</button>

              <button style="font-size:0.75rem;background:none;border:none;cursor:pointer;color:#C9A96E" onclick="adminEditDish(${d.id})"><i class="fas fa-pen" style="margin-right:3px"></i>Edit</button>
              <button style="font-size:0.75rem;background:none;border:none;cursor:pointer;color:#B76D68" onclick="adminRequestDeleteDish(${d.id})"><i class="fas fa-trash" style="margin-right:3px"></i>Delete</button>
            </div>
          </div>`).join('')}
          ${filtered.length === 0 ? `<div style="grid-column:1/-1;text-align:center;padding:48px 0"><i class="fas fa-search" style="font-size:2rem;color:#3a3a42;display:block;margin-bottom:10px"></i><p style="color:#6a6a72;margin:0">No dishes found.</p></div>` : ''}
        </div>
      </div>`;
    }

    window.adminToggleStock = (id) => {
      const dishes = adminGetDishes();
      const dish = dishes.find(d => d.id === id);
      if (dish) {
        dish.inStock = !dish.inStock;
        adminSetDishes(dishes);
        adminToast(dish.inStock ? `${dish.title} back In Stock` : `${dish.title} marked as Sold Out`, 'info');
      }
      renderAdminPanel();
    };

    window.adminEditDish = (id) => {
      const dishes = adminGetDishes();
      const dish = dishes.find(d => d.id === id);
      if (dish) { adminState.editingDish = { ...dish }; renderAdminPanel(); }
    };

    window.adminRequestDeleteDish = (id) => {
      const dishes = adminGetDishes();
      const dish = dishes.find(d => d.id === id);
      if (!dish) return;
      adminState.confirmAction = {
        message: `Are you sure you want to delete "${dish.title}"? This cannot be undone.`,
        action: () => {
          const updated = adminGetDishes().filter(d => d.id !== id);
          adminSetDishes(updated);
          adminState.confirmAction = null;
          adminToast(`"${dish.title}" deleted.`, 'info');
        }
      };
      renderAdminPanel();
    };

    window.adminAddDishSubmit = () => {
      const nd = adminState.newDish;
      if (!nd.title.trim()) { adminToast('Please enter a dish name.', 'error'); return; }
      if (nd.price <= 0) { adminToast('Price must be greater than 0.', 'error'); return; }
      const dishes = adminGetDishes();
      dishes.push({ ...nd, title: nd.title.trim(), id: Date.now() });
      adminSetDishes(dishes);
      adminState.showAddForm = false;
      adminState.newDish = { title: '', category: 'Sandwich', price: 100, dietary: 'non-veg', image: '', inStock: true };
      adminToast('Dish created successfully!', 'success');
      renderAdminPanel();
    };

    window.adminSaveDishEdit = () => {
      const ed = adminState.editingDish;
      if (!ed.title.trim()) { adminToast('Dish name cannot be empty.', 'error'); return; }
      if (ed.price <= 0) { adminToast('Price must be greater than 0.', 'error'); return; }
      const dishes = adminGetDishes().map(d => d.id === ed.id ? { ...ed, title: ed.title.trim() } : d);
      adminSetDishes(dishes);
      adminState.editingDish = null;
      adminToast('Dish updated successfully!', 'success');
      renderAdminPanel();
    };

        if (s && !o.id.toString().includes(s) && !(users[o.userId]?.name || '').toLowerCase().includes(s)) return false;

        return true;
      });
      const statuses = ['all', 'pending', 'accepted', 'preparing', 'ready', 'out_for_delivery', 'delivered', 'cancelled'];
      const statusCounts = {};
      statuses.forEach(st => { statusCounts[st] = st === 'all' ? orders.length : orders.filter(o => o.status === st).length; });
      const methodName = id => ({ upi: 'UPI / Google Pay', card: 'Card', cod: 'Cash', card_door: 'Card at Door' })[id] || '—';

      return `<div class="ap-animate-fade">

          <div style="position:relative"><i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#6a6a72;font-size:0.8rem"></i><input placeholder="Search by ID or customer..." value="${esc(adminState.orderSearch)}" oninput="adminState.orderSearch=this.value;renderAdminPanel()" style="padding-left:34px;width:240px;font-size:0.85rem" /></div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">
          ${statuses.map(st => `<button class="ap-badge" style="cursor:pointer;padding:5px 14px;font-size:0.72rem;border:1px solid ${adminState.orderFilter === st ? '#C9A96E' : 'rgba(201,169,110,0.15)'};background:${adminState.orderFilter === st ? 'rgba(201,169,110,0.15)' : 'transparent'};color:${adminState.orderFilter === st ? '#C9A96E' : '#8a8a92'}" onclick="adminState.orderFilter='${st}';renderAdminPanel()">${st.replace(/_/g, ' ')} (${statusCounts[st]})</button>`).join('')}
        </div>
        <div class="ap-table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Customer</th><th>Items</th><th>Mode</th><th>Payment</th><th style="text-align:right">Total</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>

              ${filtered.slice().reverse().map(o => `<tr>

                <td style="color:#8a8a92;font-size:0.8rem;white-space:nowrap">${o.createdAt ? new Date(o.createdAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—'}</td>

                  ${['pending','accepted','preparing','ready','out_for_delivery','delivered','cancelled'].map(st => `<option value="${st}" ${o.status === st ? 'selected' : ''}>${st.replace(/_/g, ' ')}</option>`).join('')}

              </tr>`).join('')}
              ${filtered.length === 0 ? `<tr><td colspan="9" style="text-align:center;color:#6a6a72;padding:32px"><i class="fas fa-inbox" style="font-size:1.5rem;color:#3a3a42;display:block;margin-bottom:8px"></i>No orders match.</td></tr>` : ''}
            </tbody>
          </table>
        </div>
      </div>`;

      renderAdminPanel();
    };

      const codes = adminGetDiscounts();
      return `<div class="ap-animate-fade">
        <h2 class="font-display" style="font-size:1.5rem;font-weight:700;color:#C9A96E;margin:0 0 24px">Discount Codes</h2>

            <div style="width:100px"><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">% Off</label><input type="number" min="1" max="100" placeholder="10" value="${esc(adminState.newPercent)}" oninput="adminState.newPercent=this.value" style="font-size:0.85rem" /></div>

          </div>
        </div>
        <div class="ap-table-wrap">
          <table>
            <thead><tr><th>Code</th><th style="text-align:center">Discount</th><th style="text-align:right">Action</th></tr></thead>

              ${Object.entries(codes).map(([code, pct]) => `<tr>
                <td style="font-family:monospace;color:#C9A96E;font-weight:600">${esc(code)}</td>
                <td style="text-align:center"><span class="ap-badge ap-badge-green">${pct}% off</span></td>

              </tr>`).join('')}
              ${Object.keys(codes).length === 0 ? `<tr><td colspan="3" style="text-align:center;color:#6a6a72;padding:32px"><i class="fas fa-tags" style="font-size:1.5rem;color:#3a3a42;display:block;margin-bottom:8px"></i>No discount codes yet.</td></tr>` : ''}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    window.adminAddDiscount = () => {
      const code = adminState.newCode.trim().toUpperCase();
      const pct = parseFloat(adminState.newPercent);
      if (!code) { adminToast('Please enter a discount code.', 'error'); return; }
      if (isNaN(pct) || pct <= 0 || pct > 100) { adminToast('Percentage must be between 1 and 100.', 'error'); return; }
      const codes = adminGetDiscounts();
      if (codes[code]) { adminToast(`Code "${code}" already exists.`, 'error'); return; }
      codes[code] = pct;
      adminSetDiscounts(codes);
      adminState.newCode = '';
      adminState.newPercent = '';
      adminToast(`Discount code "${code}" (${pct}% off) created!`, 'success');
      renderAdminPanel();
    };

    window.adminRequestDeleteCode = (code) => {
      adminState.confirmAction = {
        message: `Delete discount code "${code}"?`,
        action: () => {
          const codes = adminGetDiscounts();
          delete codes[code];
          adminSetDiscounts(codes);
          adminState.confirmAction = null;
          adminToast(`Code "${code}" deleted.`, 'info');
          renderAdminPanel();
        }
      };
      renderAdminPanel();
    };

            <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start">
              <div style="flex:1;min-width:200px;display:grid;gap:8px">
                <input placeholder="Paste image URL..." value="${esc(adminState.storyImg)}" oninput="adminState.storyImg=this.value" style="font-size:0.85rem" />
                <label class="ap-btn-ghost" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:0.85rem;width:fit-content"><i class="fas fa-upload"></i> Upload Image<input type="file" accept="image/*" onchange="adminUploadImage(event,'storyImg','uploadingStory')" style="display:none" /></label>
                ${adminState.uploadingStory ? `<span style="font-size:0.75rem;color:#C9A96E;display:flex;align-items:center;gap:4px"><span class="ap-spinner" style="width:14px;height:14px"></span> uploading...</span>` : ''}
              </div>
              ${adminState.storyImg ? `<div style="position:relative;flex-shrink:0"><img src="${adminState.storyImg}" alt="Preview" style="width:80px;height:80px;object-fit:cover;border-radius:12px;border:1px solid rgba(201,169,110,0.2)" /><button onclick="adminState.storyImg='';renderAdminPanel()" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#B76D68;border:none;color:#fff;font-size:0.55rem;cursor:pointer;display:flex;align-items:center;justify-content:center"><i class="fas fa-times"></i></button></div>` : ''}
            </div>
          </div>

          <div class="ap-glass" style="border-radius:16px;padding:20px">
            <h3 class="font-display" style="font-size:1.1rem;font-weight:600;margin:0 0 4px">Change Password</h3>
            <p style="font-size:0.75rem;color:#6a6a72;margin:0 0 12px">Update the admin panel password.</p>
            <div style="display:grid;gap:10px">
              <input type="password" placeholder="Current password" value="${esc(adminState.cpCurrent)}" oninput="adminState.cpCurrent=this.value" style="font-size:0.85rem" />
              <input type="password" placeholder="New password (min 4 chars)" value="${esc(adminState.cpNew)}" oninput="adminState.cpNew=this.value" style="font-size:0.85rem" />
              <input type="password" placeholder="Confirm new password" value="${esc(adminState.cpConfirm)}" oninput="adminState.cpConfirm=this.value" style="font-size:0.85rem" />
              <button class="ap-btn-ghost" style="font-size:0.85rem;width:fit-content" onclick="adminChangePassword()" ${adminState.cpSaving ? 'disabled' : ''}>
                ${adminState.cpSaving ? '<span class="ap-spinner" style="width:14px;height:14px;margin-right:6px"></span>Saving...' : '<i class="fas fa-key" style="margin-right:6px"></i>Change Password'}
              </button>
            </div>
          </div>

          <button class="ap-btn-gold" style="width:fit-content" onclick="adminSaveSettings()"><i class="fas fa-save" style="margin-right:8px"></i> Save Settings</button>
        </div>
      </div>`;
    }

    window.adminUploadImage = (e, stateKey, loadingKey) => {
      const file = e.target.files?.[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { adminToast('Image must be under 5 MB.', 'error'); return; }
      adminState[loadingKey] = true;
      renderAdminPanel();
      const reader = new FileReader();
      reader.onload = (ev) => { adminState[stateKey] = ev.target.result; adminState[loadingKey] = false; adminToast('Image uploaded!', 'success'); renderAdminPanel(); };
      reader.onerror = () => { adminState[loadingKey] = false; adminToast('Failed to read image.', 'error'); renderAdminPanel(); };
      reader.readAsDataURL(file);
    };

    window.adminSaveSettings = () => {
      const settings = { loaderBg: adminState.loaderBg, storyImg: adminState.storyImg };
      setLocal('hk_settings', settings);
      adminToast('Settings saved successfully!', 'success');
    };

    window.adminChangePassword = async () => {
      if (!adminState.cpCurrent) { adminToast('Enter your current password.', 'error'); return; }
      if (adminState.cpNew.length < 4) { adminToast('New password must be at least 4 characters.', 'error'); return; }
      if (adminState.cpNew !== adminState.cpConfirm) { adminToast('Passwords do not match.', 'error'); return; }
      adminState.cpSaving = true;
      renderAdminPanel();
      const currentHash = await hashPassword(adminState.cpCurrent);
      if (currentHash !== adminState.passHash) {
        adminToast('Current password is incorrect.', 'error');
        adminState.cpSaving = false;
        renderAdminPanel();
        return;
      }
      const newHash = await hashPassword(adminState.cpNew);
      setLocal('hk_admin_pass_hash', newHash);
      adminState.passHash = newHash;
      adminState.cpCurrent = '';
      adminState.cpNew = '';
      adminState.cpConfirm = '';
      adminState.cpSaving = false;
      adminToast('Password changed successfully!', 'success');
      renderAdminPanel();
    };

    /* --- Modals & Confirm --- */
    function adminAddDishModal() {
      const nd = adminState.newDish;
      return `<div class="ap-modal-bg" onclick="adminState.showAddForm=false;renderAdminPanel()"><div class="ap-modal-box" onclick="event.stopPropagation()">
        <h3>🍽️ New Dish</h3>
        <div style="display:grid;gap:10px">
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Dish Name *</label><input placeholder="e.g. Chicken Burger" value="${esc(nd.title)}" oninput="adminState.newDish.title=this.value" /></div>
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Category</label><select onchange="adminState.newDish.category=this.value">${adminCategories.map(c => `<option value="${c}" ${nd.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Price (₹) *</label><input type="number" min="1" placeholder="100" value="${nd.price}" oninput="adminState.newDish.price=parseInt(this.value)||0" /></div>
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Dietary</label><select onchange="adminState.newDish.dietary=this.value"><option value="veg" ${nd.dietary === 'veg' ? 'selected' : ''}>🥬 Veg</option><option value="non-veg" ${nd.dietary === 'non-veg' ? 'selected' : ''}>🍗 Non-Veg</option></select></div>
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Image URL</label><input placeholder="https://..." value="${esc(nd.image)}" oninput="adminState.newDish.image=this.value" /></div>
          <div style="display:flex;gap:10px;margin-top:6px">
            <button class="ap-btn-gold" style="flex:1" onclick="adminAddDishSubmit()"><i class="fas fa-plus" style="margin-right:4px"></i> Create Dish</button>
            <button class="ap-btn-ghost" style="flex:1" onclick="adminState.showAddForm=false;renderAdminPanel()">Cancel</button>
          </div>
        </div>
      </div></div>`;
    }

    function adminEditDishModal() {
      const ed = adminState.editingDish;
      if (!ed) return '';
      return `<div class="ap-modal-bg" onclick="adminState.editingDish=null;renderAdminPanel()"><div class="ap-modal-box" onclick="event.stopPropagation()">
        <h3>✏️ Edit Dish</h3>
        <div style="display:grid;gap:10px">
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Dish Name *</label><input value="${esc(ed.title)}" oninput="adminState.editingDish.title=this.value" /></div>
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Category</label><select onchange="adminState.editingDish.category=this.value">${adminCategories.map(c => `<option value="${c}" ${ed.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Price (₹) *</label><input type="number" min="1" value="${ed.price}" oninput="adminState.editingDish.price=parseInt(this.value)||0" /></div>
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Dietary</label><select onchange="adminState.editingDish.dietary=this.value"><option value="veg" ${ed.dietary === 'veg' ? 'selected' : ''}>🥬 Veg</option><option value="non-veg" ${ed.dietary === 'non-veg' ? 'selected' : ''}>🍗 Non-Veg</option></select></div>
          <div><label style="font-size:0.7rem;color:#8a8a92;display:block;margin-bottom:4px">Image URL</label><input value="${esc(ed.image)}" oninput="adminState.editingDish.image=this.value" /></div>
          <div style="display:flex;gap:10px;margin-top:6px">
            <button class="ap-btn-gold" style="flex:1" onclick="adminSaveDishEdit()"><i class="fas fa-check" style="margin-right:4px"></i> Save Changes</button>
            <button class="ap-btn-ghost" style="flex:1" onclick="adminState.editingDish=null;renderAdminPanel()">Cancel</button>
          </div>
        </div>
      </div></div>`;
    }

    function adminConfirmDialog() {
      const c = adminState.confirmAction;
      if (!c) return '';
      return `<div class="ap-confirm-bg" onclick="adminState.confirmAction=null;renderAdminPanel()"><div class="ap-confirm-box" onclick="event.stopPropagation()">
        <i class="fas fa-exclamation-triangle" style="color:#C9A96E;font-size:1.5rem;display:block;margin-bottom:12px"></i>
        <p style="font-size:0.9rem;line-height:1.6;margin:0 0 18px">${c.message}</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button style="background:#B76D68;color:#fff;padding:8px 24px;border-radius:10px;border:none;cursor:pointer;font-size:0.85rem" onclick="adminState.confirmAction.action()">Yes, Delete</button>
          <button class="ap-btn-ghost" style="padding:8px 24px;font-size:0.85rem" onclick="adminState.confirmAction=null;renderAdminPanel()">Cancel</button>
        </div>
      </div></div>`;
    }

    function adminToastsHTML() {
      if (adminState.toasts.length === 0) return '';
      return `<div class="ap-toast-wrap">${adminState.toasts.map(t => `<div class="ap-toast ap-toast-${t.type}">
        ${t.type === 'success' ? '<i class="fas fa-check-circle" style="color:#A3B5A8"></i>' : ''}
        ${t.type === 'error' ? '<i class="fas fa-exclamation-circle" style="color:#B76D68"></i>' : ''}
        ${t.type === 'info' ? '<i class="fas fa-info-circle" style="color:#C9A96E"></i>' : ''}
        ${esc(t.message)}
      </div>`).join('')}</div>`;
    }

    /* ========================================
       Initialize
    ======================================== */
    init();
  </script>
