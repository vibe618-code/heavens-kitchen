                if (mode === 'signup') {
                    const users = LS.get('ck_users', {});
                    if (users[form.phone]) { setError('Phone already registered.'); setLoading(false); return; }
                    users[form.phone] = { phone: form.phone, password: form.password, name: form.name, address: form.address, loyalty_coins: 0 };
                    LS.set('ck_users', users); LS.set('ck_currentUser', form.phone);
                    setUserName(form.name); setLoading(false); onLogin();
                } else {
                    const users = LS.get('ck_users', {});
                    const user = users[form.phone];
                    if (!user || user.password !== form.password) { setError('Invalid phone or password.'); setLoading(false); return; }
                    LS.set('ck_currentUser', form.phone);
                    setUserName(user.name); setLoading(false); onLogin();
                }
            };
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4" aria-modal="true" role="dialog">
                    <div className="absolute inset-0 matte-glossy-bg"></div><SparkleField />
                    <div className="relative z-10 glass-card rounded-3xl p-8 md:p-10 w-full max-w-md animate-scale-in shadow-2xl">
                        <h2 className="font-display text-3xl font-bold text-dark-chocolate dark:text-cream text-center mb-6">{t.loginWelcome}<span className="text-red-velvet">.</span></h2>
                        {error && <div className="bg-error/20 text-error p-3 rounded-lg mb-4 text-sm">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-sm font-bold">{t.phone}</label><input type="tel" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-white/70 dark:bg-dark-chocolate/60 border" placeholder="+91 98765 43210" required /></div>
                            <div><label className="block text-sm font-bold">{t.password}</label><input type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-white/70 dark:bg-dark-chocolate/60 border" placeholder="••••••••" required minLength={6} /></div>
                            {mode==='signup' && (<>
                                <div><label className="block text-sm font-bold">{t.name}</label><input type="text" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-white/70 dark:bg-dark-chocolate/60 border" required /></div>
                                <div><label className="block text-sm font-bold">{t.address}</label><input type="text" value={form.address} onChange={e=>setForm({...form,address:e.target.value})} className="w-full px-4 py-3 rounded-xl bg-white/70 dark:bg-dark-chocolate/60 border" required /></div>
                            </>)}
                            <button type="submit" disabled={loading} className={`w-full py-3.5 rounded-xl font-semibold shadow-lg transition active:scale-95 ${loading?'bg-gray-400 cursor-wait':'bg-velvet-red text-white hover:bg-red-velvet'}`}>{loading?'Processing...':(mode==='login'?t.login:t.signup)}</button>
                        </form>
                        <div className="mt-6 text-center"><button onClick={()=>{ setMode(mode==='login'?'signup':'login'); setError(''); }} className="text-sm text-dark-chocolate/70 dark:text-cream/70 hover:underline">{mode==='login'?t.noAccount:t.hasAccount}</button></div>
                        <div className="mt-6 text-center"><button onClick={onSkip} className="text-sm text-dark-chocolate/50 dark:text-cream/50 hover:underline">{t.skip}</button></div>
                    </div>
                </div>
            );
        };

        // ======================== ADMIN COMPONENTS ========================
        const AdminDashboard = ({ dishes, setDishes, orders, setOrders, discountCodes, setDiscountCodes, settings, setSettings, onLogout, onCloseAdmin }) => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [search, setSearch] = useState('');
            const [editingDish, setEditingDish] = useState(null);
            const [showAddForm, setShowAddForm] = useState(false);
            const [newDish, setNewDish] = useState({ title:'', category:'Sandwich', price:100, dietary:'non-veg', image:'', inStock:true });
            const [loaderBg, setLoaderBg] = useState(settings.loaderBg || '');
            const [storyImg, setStoryImg] = useState(settings.storyImg || '');

            const totalRevenue = orders.reduce((s,o)=>s+o.total,0);
            const totalOrders = orders.length;
            const avgOrderValue = totalOrders ? Math.round(totalRevenue/totalOrders) : 0;

            const updateOrderStatus = (id, status) => setOrders(orders.map(o=>o.id===id?{...o,status}:o));
            const toggleStock = (id) => setDishes(dishes.map(d=>d.id===id?{...d,inStock:!d.inStock}:d));
            const addDish = () => { const id = Date.now(); setDishes([...dishes, {...newDish, id}]); setShowAddForm(false); };
            const saveDishEdit = () => { setDishes(dishes.map(d=>d.id===editingDish.id?editingDish:d)); setEditingDish(null); };
            const deleteDish = (id) => setDishes(dishes.filter(d=>d.id!==id));

            const saveSettings = () => {
                const newSettings = { loaderBg, storyImg };
                setSettings(newSettings);
                LS.set('ck_settings', newSettings);
                alert('Settings saved!');
            };

            const handleImageUpload = (e, setter) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => setter(ev.target.result);
                reader.readAsDataURL(file);
            };

            const filteredOrders = orders.filter(o=>!search || o.id.toString().includes(search) || (o.customer?.name||'').toLowerCase().includes(search.toLowerCase()));
            const filteredDishes = dishes.filter(d=>d.title.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="fixed inset-0 z-50 flex bg-obsidian text-cream">
                    <div className="w-64 bg-obsidian border-r border-gold/10 flex flex-col">
                        <div className="p-6 font-display text-2xl font-bold text-gold">CK<span className="text-cream">Admin</span></div>
                        <nav className="flex-1 px-4 space-y-1">
                            {['dashboard','dishes','orders','discounts','settings'].map(tab=>(
                                <button key={tab} onClick={()=>setActiveTab(tab)} className={`w-full text-left py-3 px-4 rounded-xl flex items-center gap-3 capitalize ${activeTab===tab?'bg-gold/20 text-gold':'text-cream/60 hover:text-cream'}`}>{tab}</button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gold/10">
                            <button onClick={() => { onLogout(); onCloseAdmin(); }} className="text-sm text-cream/50 hover:text-gold w-full text-left">Logout & Return to Site</button>
                        </div>
                    </div>
                    <div className="flex-1 overflow-auto p-8">
                        {activeTab==='dashboard' && (
                            <div className="grid grid-cols-3 gap-6 mb-8">
                                <div className="bg-obsidian/60 border border-gold/10 rounded-2xl p-5"><p className="text-xs text-cream/40">Revenue</p><p className="text-3xl font-bold">₹{totalRevenue.toLocaleString('en-IN')}</p></div>
                                <div className="bg-obsidian/60 border border-gold/10 rounded-2xl p-5"><p className="text-xs text-cream/40">Orders</p><p className="text-3xl font-bold">{totalOrders}</p></div>
                                <div className="bg-obsidian/60 border border-gold/10 rounded-2xl p-5"><p className="text-xs text-cream/40">Avg Order</p><p className="text-3xl font-bold">₹{avgOrderValue}</p></div>
                            </div>
                        )}
                        {activeTab==='dishes' && (
                            <>
                                <div className="flex justify-between mb-4">
                                    <h2 className="text-xl font-semibold">Dishes ({filteredDishes.length})</h2>
                                    <div className="flex gap-2">
                                        <input placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} className="px-3 py-2 bg-obsidian border border-gold/20 rounded-xl text-sm" />
                                        <button onClick={()=>setShowAddForm(true)} className="px-4 py-2 bg-gold text-obsidian rounded-xl font-semibold">+ Add Dish</button>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {filteredDishes.map(d=>(
                                        <div key={d.id} className="bg-obsidian/60 border border-gold/10 rounded-xl p-4 flex justify-between items-start">
                                            <div className="flex gap-3">
                                                <img src={d.image} alt={d.title} className="w-12 h-12 rounded-lg object-cover" />
                                                <div>
                                                    <p className="font-semibold">{d.title}</p>
                                                    <p className="text-xs text-cream/40">₹{d.price} · {d.category} · {d.dietary}</p>
                                                    <button onClick={()=>toggleStock(d.id)} className={`text-xs ${d.inStock?'text-sage-light':'text-rose'}`}>{d.inStock?'In Stock':'Sold Out'}</button>
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={()=>setEditingDish({...d})} className="text-xs text-gold hover:underline">Edit</button>
                                                <button onClick={()=>deleteDish(d.id)} className="text-xs text-rose hover:underline">Delete</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                        {activeTab==='orders' && (
                            <>
                                <div className="flex justify-between mb-4">
                                    <h2 className="text-xl font-semibold">Orders</h2>
                                    <input placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} className="px-3 py-2 bg-obsidian border border-gold/20 rounded-xl text-sm" />
                                </div>
                                <table className="w-full text-sm">
                                    <thead className="border-b border-gold/10"><tr><th className="text-left p-4">ID</th><th className="text-left p-4">Customer</th><th className="text-left p-4">Date</th><th className="text-right p-4">Total</th><th className="p-4">Status</th></tr></thead>
                                    <tbody>
                                        {filteredOrders.slice().reverse().map(o=>(
                                            <tr key={o.id} className="border-t border-gold/5">
                                                <td className="p-4 font-mono text-gold">{o.id}</td>
                                                <td className="p-4">{o.customer?.name}</td>
                                                <td className="p-4 text-cream/60">{new Date(o.created_at).toLocaleString()}</td>
                                                <td className="p-4 text-right font-semibold">₹{o.total}</td>
                                                <td className="p-4">
                                                    <select value={o.status||'Processing'} onChange={e=>updateOrderStatus(o.id, e.target.value)} className="bg-obsidian border border-gold/20 rounded px-2 py-1 text-xs">
                                                        <option>Processing</option><option>Out for Delivery</option><option>Delivered</option>
                                                    </select>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </>
                        )}
                        {activeTab==='discounts' && (
                            <div>
                                <h2 className="text-xl font-semibold mb-4">Discount Codes</h2>
                                <div className="flex gap-2 mb-4">
                                    <input placeholder="Code" id="discCode" className="px-4 py-2 bg-obsidian border border-gold/20 rounded-xl flex-1" />
                                    <input type="number" placeholder="% Off" id="discPercent" className="px-4 py-2 bg-obsidian border border-gold/20 rounded-xl w-24" />
                                    <button onClick={()=>{ const code=document.getElementById('discCode').value.toUpperCase(); const pct=parseFloat(document.getElementById('discPercent').value); if(code&&!isNaN(pct)) setDiscountCodes({...discountCodes,[code]:pct}); }} className="px-4 py-2 bg-gold text-obsidian rounded-xl font-semibold">Add</button>
                                </div>
                                <table className="w-full text-sm"><thead className="border-b border-gold/10"><tr><th className="text-left p-4">Code</th><th className="text-center p-4">Discount</th><th className="p-4">Action</th></tr></thead><tbody>{Object.entries(discountCodes).map(([code,pct])=><tr key={code} className="border-t border-gold/5"><td className="p-4 font-mono text-gold">{code}</td><td className="p-4 text-center">{pct}%</td><td className="p-4"><button onClick={()=>{ const newCodes={...discountCodes}; delete newCodes[code]; setDiscountCodes(newCodes); }} className="text-xs text-rose hover:underline">Delete</button></td></tr>)}</tbody></table>
                            </div>
                        )}
                        {activeTab==='settings' && (
                            <div className="max-w-2xl">
                                <h2 className="text-xl font-semibold mb-6">Site Settings</h2>
                                <div className="space-y-6">
                                    <div className="bg-obsidian/60 border border-gold/10 rounded-2xl p-5">
                                        <h3 className="font-display text-lg font-semibold mb-3">Loading Screen Background</h3>
                                        <div className="flex gap-4 items-start">
                                            <div className="flex-1 space-y-2">
                                                <input placeholder="Image URL" value={loaderBg} onChange={e=>setLoaderBg(e.target.value)} className="w-full p-2 bg-obsidian border border-gold/20 rounded" />
                                                <label className="bg-gold/10 text-gold px-3 py-1.5 rounded-xl cursor-pointer inline-block text-sm">Upload Image<input type="file" accept="image/*" onChange={(e)=>handleImageUpload(e,setLoaderBg)} className="hidden" /></label>
                                            </div>
                                            {loaderBg && <img src={loaderBg} alt="Preview" className="w-24 h-24 object-cover rounded-xl border border-gold/20" />}
                                        </div>
                                    </div>
                                    <div className="bg-obsidian/60 border border-gold/10 rounded-2xl p-5">
                                        <h3 className="font-display text-lg font-semibold mb-3">Our Story Image</h3>
                                        <div className="flex gap-4 items-start">
                                            <div className="flex-1 space-y-2">
                                                <input placeholder="Image URL" value={storyImg} onChange={e=>setStoryImg(e.target.value)} className="w-full p-2 bg-obsidian border border-gold/20 rounded" />
                                                <label className="bg-gold/10 text-gold px-3 py-1.5 rounded-xl cursor-pointer inline-block text-sm">Upload Image<input type="file" accept="image/*" onChange={(e)=>handleImageUpload(e,setStoryImg)} className="hidden" /></label>
                                            </div>
                                            {storyImg && <img src={storyImg} alt="Preview" className="w-24 h-24 object-cover rounded-xl border border-gold/20" />}
                                        </div>
                                    </div>
                                    <button onClick={saveSettings} className="px-8 py-3 bg-gold text-obsidian rounded-xl font-semibold hover:bg-gold-dark transition">Save Settings</button>
                                </div>
                            </div>
                        )}
                    </div>
                    {/* Add/Edit Dish Modals */}
                    {showAddForm && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setShowAddForm(false)}>
                            <div className="bg-obsidian border border-gold/20 rounded-2xl p-6 w-full max-w-md" onClick={e=>e.stopPropagation()}>
                                <h3 className="text-lg font-bold mb-4">New Dish</h3>
                                <input placeholder="Title" value={newDish.title} onChange={e=>setNewDish({...newDish,title:e.target.value})} className="w-full p-2 bg-obsidian border rounded mb-2" />
                                <select value={newDish.category} onChange={e=>setNewDish({...newDish,category:e.target.value})} className="w-full p-2 bg-obsidian border rounded mb-2"><option>Sandwich</option><option>Burger</option><option>Fries</option><option>Pizza</option><option>Wrap</option><option>Sliders / Sides</option><option>Milkshake</option><option>Mojito</option></select>
                                <input type="number" placeholder="Price" value={newDish.price} onChange={e=>setNewDish({...newDish,price:parseInt(e.target.value)})} className="w-full p-2 bg-obsidian border rounded mb-2" />
                                <select value={newDish.dietary} onChange={e=>setNewDish({...newDish,dietary:e.target.value})} className="w-full p-2 bg-obsidian border rounded mb-2"><option>veg</option><option>non-veg</option></select>
                                <input placeholder="Image URL" value={newDish.image} onChange={e=>setNewDish({...newDish,image:e.target.value})} className="w-full p-2 bg-obsidian border rounded mb-4" />
                                <button onClick={addDish} className="w-full py-2 bg-gold text-obsidian rounded-xl font-semibold">Create</button>
                            </div>
                        </div>
                    )}
                    {editingDish && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setEditingDish(null)}>
                            <div className="bg-obsidian border border-gold/20 rounded-2xl p-6 w-full max-w-md" onClick={e=>e.stopPropagation()}>
                                <h3 className="text-lg font-bold mb-4">Edit Dish</h3>
                                <input value={editingDish.title} onChange={e=>setEditingDish({...editingDish,title:e.target.value})} className="w-full p-2 bg-obsidian border rounded mb-2" />
                                <select value={editingDish.category} onChange={e=>setEditingDish({...editingDish,category:e.target.value})} className="w-full p-2 bg-obsidian border rounded mb-2"><option>Sandwich</option><option>Burger</option><option>Fries</option><option>Pizza</option><option>Wrap</option><option>Sliders / Sides</option><option>Milkshake</option><option>Mojito</option></select>
                                <input type="number" value={editingDish.price} onChange={e=>setEditingDish({...editingDish,price:parseInt(e.target.value)})} className="w-full p-2 bg-obsidian border rounded mb-2" />
                                <select value={editingDish.dietary} onChange={e=>setEditingDish({...editingDish,dietary:e.target.value})} className="w-full p-2 bg-obsidian border rounded mb-2"><option>veg</option><option>non-veg</option></select>
                                <input value={editingDish.image} onChange={e=>setEditingDish({...editingDish,image:e.target.value})} className="w-full p-2 bg-obsidian border rounded mb-4" />
                                <button onClick={saveDishEdit} className="w-full py-2 bg-gold text-obsidian rounded-xl font-semibold">Save</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminPanel = ({ dishes, setDishes, orders, setOrders, discountCodes, setDiscountCodes, settings, setSettings, onCloseAdmin }) => {
            const [auth, setAuth] = useState(false);
            const [pass, setPass] = useState('');
            const [adminPass, setAdminPass] = useState(() => localStorage.getItem('ck_admin_pass') || '');
            const [setup, setSetup] = useState(!adminPass);
            const [newPass, setNewPass] = useState('');

            const handleLogin = () => { if (pass === adminPass) setAuth(true); };
            const handleSetup = () => { if (newPass.length >= 4) { localStorage.setItem('ck_admin_pass', newPass); setAdminPass(newPass); setSetup(false); setAuth(true); } };
            const handleLogout = () => { setAuth(false); };

            if (!auth) {
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-obsidian/90">
                        <button onClick={onCloseAdmin} className="absolute top-4 left-4 p-2 rounded-full bg-obsidian/60 hover:bg-obsidian text-cream/70 hover:text-cream transition z-10">
                            <i className="fas fa-arrow-left text-xl"></i>
                        </button>
                        <div className="bg-obsidian border border-gold/20 rounded-2xl p-8 w-full max-w-sm mx-4">
                            {setup ? (
                                <div className="space-y-4"><h3 className="text-xl font-bold text-cream">Set Admin Password</h3><input type="password" value={newPass} onChange={e=>setNewPass(e.target.value)} className="w-full p-3 bg-obsidian border border-gold/30 rounded-xl text-cream" placeholder="New password" /><button onClick={handleSetup} className="w-full py-3 bg-gold text-obsidian rounded-xl font-semibold">Set Password</button></div>
                            ) : (
                                <div className="space-y-4"><h3 className="text-xl font-bold text-cream">Admin Login</h3><input type="password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-3 bg-obsidian border border-gold/30 rounded-xl text-cream" placeholder="Password" /><button onClick={handleLogin} className="w-full py-3 bg-gold text-obsidian rounded-xl font-semibold">Login</button></div>
                            )}
                        </div>
                    </div>
                );
            }
            return <AdminDashboard dishes={dishes} setDishes={setDishes} orders={orders} setOrders={setOrders} discountCodes={discountCodes} setDiscountCodes={setDiscountCodes} settings={settings} setSettings={setSettings} onLogout={handleLogout} onCloseAdmin={onCloseAdmin} />;
        };

        // ======================== CUSTOMER-FACING COMPONENTS ========================
        const SkeletonCard = () => (
            <div className="masonry-item rounded-2xl overflow-hidden shadow-lg">
                <div className="skeleton-box h-56 w-full"></div>
                <div className="menu-item-bar p-4 space-y-2"><div className="skeleton-box h-5 w-3/4 rounded"></div><div className="skeleton-box h-4 w-1/4 rounded"></div></div>
            </div>
        );

        const CustomizeModal = ({ t, dish, onClose, onAddToCart }) => {
            const [custom, setCustom] = useState({truffle:false, cheese:false, noOnion:false});
            const extraCost = (custom.truffle?20:0)+(custom.cheese?15:0);
            const finalPrice = dish.price + extraCost;
            const modalRef = useRef(null);
            useFocusTrap(modalRef, true);
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={onClose}>
                    <div ref={modalRef} className="bg-cream dark:bg-dark-chocolate rounded-3xl p-6 max-w-sm w-full animate-scale-in" onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true">
                        <h3 className="font-display text-2xl font-bold mb-2">{dish.title}</h3>
                        <p className="text-velvet-red font-bold text-xl mb-4">₹{dish.price}</p>
                        <div className="space-y-3 mb-6">
                            <label className="flex items-center gap-2"><input type="checkbox" checked={custom.truffle} onChange={e=>setCustom({...custom,truffle:e.target.checked})} />{t.addTruffle}</label>
                            <label className="flex items-center gap-2"><input type="checkbox" checked={custom.cheese} onChange={e=>setCustom({...custom,cheese:e.target.checked})} />{t.addCheese}</label>
                            <label className="flex items-center gap-2"><input type="checkbox" checked={custom.noOnion} onChange={e=>setCustom({...custom,noOnion:e.target.checked})} />{t.noOnion}</label>
                        </div>
                        <div className="mb-4 text-right font-semibold">Total: ₹{finalPrice}</div>
                        <button onClick={()=>{ const additions = []; if(custom.truffle) additions.push("Extra Cheese"); if(custom.cheese) additions.push("Extra Sauce"); if(custom.noOnion) additions.push("No Onion"); onAddToCart(dish, additions.join(', '), finalPrice); onClose(); }} className="w-full py-3 bg-velvet-red text-white rounded-xl font-semibold active:scale-95">{t.addToCart}</button>
                    </div>
                </div>
            );
        };

        const QuantityStepper = ({ qty, onIncrement, onDecrement }) => ( <div className="flex items-center gap-2 bg-surface rounded-btn px-2 py-1 border"><button onClick={onDecrement} disabled={qty<=1} className="w-7 h-7 flex items-center justify-center rounded-full font-bold text-lg hover:bg-gray-200 dark:hover:bg-gray-700 disabled:opacity-30">−</button><span className="w-8 text-center font-semibold text-sm">{qty}</span><button onClick={onIncrement} className="w-7 h-7 flex items-center justify-center rounded-full font-bold text-lg hover:bg-gray-200 dark:hover:bg-gray-700">+</button></div> );
        const CartItemRow = ({ item, onIncrement, onDecrement, onRemove }) => ( <div className="bg-elevated rounded-card p-4 flex items-center gap-3 border"><img src={item.image} className="w-14 h-14 rounded-lg object-cover flex-shrink-0" alt={item.name} loading="lazy" /><div className="flex-1 min-w-0"><p className="font-semibold text-sm truncate cart-hd-text">{item.name}</p><p className="text-xs">₹{item.unitPrice} each</p>{item.customizations && <p className="text-xs text-amber-600">{item.customizations}</p>}</div><QuantityStepper qty={item.qty} onIncrement={()=>onIncrement(item.sku, item.customizations)} onDecrement={()=>onDecrement(item.sku, item.customizations)} /><span className="font-semibold text-sm w-16 text-right">₹{(item.unitPrice*item.qty).toFixed(2)}</span><button onClick={()=>onRemove(item.sku, item.customizations)} className="text-error text-lg"><i className="fas fa-trash-alt"></i></button></div> );

        };

        const PaymentMethodSelector = ({ paymentMode, onPaymentModeChange, selectedMethod, onSelectMethod, fulfillmentMode }) => { const isDelivery = fulfillmentMode==='delivery'; const onlineMethods = [ { id:'card1', label:'Visa •••• 4242', icon:'fab fa-cc-visa' }, { id:'upi', label:'UPI / Google Pay', icon:'fas fa-mobile-alt' } ]; const doorstepMethods = [ { id:'cod', label:'Cash on Delivery', icon:'fas fa-money-bill-wave' }, { id:'cardAtDoor', label:'Card at Door', icon:'fas fa-credit-card' } ]; const methods = paymentMode==='online'?onlineMethods:doorstepMethods; return ( <div className="bg-elevated rounded-card p-5 mb-4 border"><h3 className="font-display text-lg font-semibold mb-4">Payment Method</h3><div className="flex bg-surface rounded-btn p-1 mb-4 border"><button onClick={()=>onPaymentModeChange('online')} className={`flex-1 py-2 px-3 rounded-btn text-sm font-semibold transition ${paymentMode==='online'?'bg-accent-primary text-white shadow-sm':'text-text-secondary hover:text-text-primary'}`}><i className="fas fa-globe mr-1"></i> Pay Online</button><button onClick={()=>onPaymentModeChange('doorstep')} className={`flex-1 py-2 px-3 rounded-btn text-sm font-semibold transition ${paymentMode==='doorstep'?'bg-accent-primary text-white shadow-sm':'text-text-secondary hover:text-text-primary'}`}><i className="fas fa-hand-holding-usd mr-1"></i> {isDelivery?'Pay at Doorstep':'Pay at Counter'}</button></div><div className="space-y-2">{methods.map(method=>(<div key={method.id} onClick={()=>onSelectMethod(method)} className={`flex items-center gap-3 p-3 rounded-card cursor-pointer border transition ${selectedMethod?.id===method.id?'border-accent-primary bg-accent-primary/5':'border-border hover:border-accent-secondary/50'}`}><i className={`${method.icon} text-2xl`}></i><div className="flex-1"><p className="cart-hd-text">{method.label}</p></div><div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${selectedMethod?.id===method.id?'border-accent-primary':'border-border'}`}>{selectedMethod?.id===method.id&&<div className="w-3 h-3 rounded-full bg-accent-primary"></div>}</div></div>))}</div></div> );
        };
        const StickyBottomCTA = ({ t, grandTotal, isProcessing, disabled, onPlaceOrder }) => ( <div className="sticky bottom-0 z-20 bg-elevated border-t px-4 py-4"><div className="max-w-lg mx-auto"><button onClick={onPlaceOrder} disabled={disabled||isProcessing} className={`w-full font-semibold py-4 px-6 rounded-btn text-base flex items-center justify-center gap-2 transition active:scale-95 ${disabled?'bg-border text-text-secondary cursor-not-allowed':'bg-accent-primary text-white hover:brightness-110'}`}>{isProcessing?<><span className="spinner"></span> Processing...</>:`${t.placeOrder} ₹${grandTotal.toFixed(2)}`}</button>{disabled&&!isProcessing&&<p className="text-xs text-error text-center mt-2">⚠️ Please select a payment method</p>}</div></div> );
        const AnimatedCheckmark = () => (<svg className="w-24 h-24" viewBox="0 0 52 52"><circle className="checkmark-circle" cx="26" cy="26" r="25" fill="none" stroke="#3C6E47" strokeWidth="3"/><path className="checkmark-check" fill="none" stroke="#3C6E47" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" d="M14 27l7 7 16-16"/></svg>);
        const OrderConfirmation = ({ t, order, coinsEarned, onBack }) => { const [showTracking, setShowTracking] = useState(false); const [progress, setProgress] = useState(0); const etaMinutes = parseInt(order.eta) || 30; const totalDuration = etaMinutes*60000; useEffect(()=>{ const timer = setTimeout(()=>setShowTracking(true),3000); return ()=>clearTimeout(timer); },[]); useEffect(()=>{ if(!showTracking) return; const stepMs=100; const totalSteps=totalDuration/stepMs; let cur=0; const interval=setInterval(()=>{ cur++; const pct=Math.min(100,(cur/totalSteps)*100); setProgress(pct); if(cur>=totalSteps) clearInterval(interval); },stepMs); return ()=>clearInterval(interval); },[showTracking]); return ( <div className="min-h-screen bg-base p-6 flex flex-col items-center justify-center"><div className="max-w-lg w-full bg-elevated rounded-card p-8 shadow-card border text-center"><div className="confirm-check-center mb-4"><AnimatedCheckmark /></div><h2 className="font-display text-3xl font-bold mt-4 mb-2">{t.orderSuccess}</h2><p className="text-success font-semibold text-lg mb-6">+{coinsEarned} Coins earned</p>{showTracking&&<div className="animate-fade-in"><h3 className="font-display text-xl font-semibold mb-4">{t.trackOrder}</h3><div className="flex items-center gap-4 bg-surface rounded-card p-4 border mb-6"><i className="fas fa-motorcycle text-3xl text-accent-primary"></i><div><p className="font-bold">{progress<25?t.confirmed:progress<50?t.preparing:progress<75?t.out:t.delivered}</p><p className="text-sm">ETA: <strong className="text-accent-primary">{order.eta}</strong></p></div></div><div className="w-full bg-border rounded-full h-3 mb-3 overflow-hidden"><div className="bg-success h-full rounded-full transition-all duration-300" style={{width:`${progress}%`}}></div></div></div>}<button onClick={onBack} className="mt-6 w-full py-3 bg-velvet-red text-white rounded-xl font-semibold hover:bg-red-velvet active:scale-95">Back to Menu</button></div></div> ); };

        const OurStory = ({ t, storyImg }) => { const [ref, inView] = useInView(0.2); return (<section ref={ref} className="w-full max-w-7xl mx-auto px-6 py-16 md:py-24"><div className="grid md:grid-cols-2 gap-12 lg:gap-20 items-center"><div className="relative order-2 md:order-1"><div className="aspect-[4/5] rounded-3xl overflow-hidden shadow-2xl image-hover-zoom float-frame"><img src={storyImg || `https://images.unsplash.com/photo-1577219491135-ce391730fb2c?${HRO}`} alt="Chef plating a gourmet dish" className="w-full h-full object-cover" loading="lazy" /></div></div><div className="order-1 md:order-2"><p className="text-velvet-red uppercase tracking-[0.25em] text-sm font-semibold mb-4">Our Story</p><h2 className="font-display text-4xl md:text-5xl font-bold text-dark-chocolate dark:text-cream mb-6 leading-tight">Redefining Gourmet <span className="italic text-velvet-red">Delivery</span></h2><p className="text-dark-chocolate/70 dark:text-cream/70 leading-relaxed mb-5 text-lg">Founded in 2021, Cloud Kitchen Co. was born from a passion for exceptional food and a desire to make fine dining accessible at home.</p><p className="text-dark-chocolate/70 dark:text-cream/70 leading-relaxed mb-8 text-lg">Our team of award‑winning chefs sources the finest ingredients and crafts menus that blend global techniques with local flavours.</p><div className="grid grid-cols-3 gap-6 pt-4"><div className="text-center"><p className="font-display text-3xl lg:text-4xl font-bold text-velvet-red">10k+</p><p className="text-sm mt-1">Orders Delivered</p></div><div className="text-center"><p className="font-display text-3xl lg:text-4xl font-bold text-velvet-red">4.9</p><p className="text-sm mt-1">Average Rating</p></div><div className="text-center"><p className="font-display text-3xl lg:text-4xl font-bold text-velvet-red">5</p><p className="text-sm mt-1">Cities Served</p></div></div></div></div></section>); };
        const TestimonialsSlider = () => { const testimonials = [ { name:'Riya & Arjun Mehta', location:'Mumbai', text:'The food from Cloud Kitchen Co. rivals any fine dining restaurant. Every bite was a revelation!', image:`https://images.unsplash.com/photo-1494790108377-be9c29b29330?${HRAVATAR}` },{ name:'Vikram Singh', location:'Delhi', text:'I ordered the truffle risotto for a date night at home – perfection. Delivery was prompt and hot.', image:`https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?${HRAVATAR}` },{ name:'Ananya Patel', location:'Bangalore', text:'Their event catering transformed our anniversary dinner. Five stars! Unforgettable experience.', image:`https://images.unsplash.com/photo-1438761681033-6461ffad8d80?${HRAVATAR}` } ]; const [current, setCurrent] = useState(0); const trackStyle = { transform:`translateX(-${current*100}%)`, transition:'transform 0.7s cubic-bezier(0.2,0.9,0.4,1.1)' }; useEffect(()=>{ const interval=setInterval(()=>{ setCurrent((prev)=>(prev+1)%testimonials.length); },5000); return ()=>clearInterval(interval); },[]); return (<section className="w-full max-w-5xl mx-auto px-6 py-16 md:py-24 text-center"><p className="text-velvet-red uppercase tracking-[0.25em] text-sm font-semibold mb-4">Testimonials</p><h2 className="font-display text-4xl md:text-5xl font-bold mb-12">What Our <span className="italic text-velvet-red">Customers</span> Say</h2><div className="relative overflow-hidden min-h-[320px]"><div className="testimonial-track" style={trackStyle}>{testimonials.map((t,idx)=>(<div key={idx} className="testimonial-slide"><div className="glass-card rounded-3xl p-8 md:p-10 max-w-2xl mx-auto float-frame"><div className="flex justify-center mb-4 text-velvet-red text-2xl">{"★".repeat(5)}</div><p className="text-dark-chocolate/80 dark:text-cream/80 text-lg leading-relaxed italic mb-6">&ldquo;{t.text}&rdquo;</p><div className="flex items-center justify-center gap-4"><img src={t.image} alt={t.name} className="w-14 h-14 rounded-full object-cover ring-2 ring-velvet-red/40" loading="lazy" /><div className="text-left"><p className="font-semibold">{t.name}</p><p className="text-sm">{t.location}</p></div></div></div></div>))}</div></div><div className="flex justify-center gap-3 mt-8">{testimonials.map((_,idx)=>(<div key={idx} className={`dot ${idx===current?'active':''}`} onClick={()=>setCurrent(idx)}></div>))}</div></section>); };

        const HamburgerMenu = ({ t, isOpen, onClose, darkMode, onToggleDarkMode, onNavigate, userName, loyaltyPoints }) => {

y-between px-3 py-2.5 rounded-xl bg-white/30 dark:bg-black/20 hover:bg-white/40 transition text-sm"><span className="flex items-center gap-2"><i className={`fas ${darkMode?'fa-sun':'fa-moon'} text-base`}></i><span className="font-medium text-sm cart-hd-text">{t.darkMode}</span></span><div className={`w-9 h-5 rounded-full relative transition ${darkMode?'bg-velvet-red':'bg-gray-400'}`}><div className={`absolute top-0.5 w-4 h-4 rounded-full bg-white shadow transition ${darkMode?'left-4':'left-0.5'}`}></div></div></button><button onClick={()=>{ onNavigate('signout'); handleClose(); }} className="w-full flex items-center gap-2 px-3 py-2.5 rounded-xl text-text-secondary hover:bg-white/20 transition text-sm"><i className="fas fa-sign-out-alt text-sm"></i><span>{t.signOut}</span></button></div></div></div>);

        const MenuGallery = ({ t, dishes, onOrder, favorites, toggleFavorite, dietaryFilter, setDietaryFilter }) => {
            const orderedCategories = useMemo(() => { const existing = new Set(dishes.map(d=>d.category)); return categoryOrder.filter(c=>existing.has(c)); }, [dishes]);
            const [filter, setFilter] = useState(orderedCategories[0]||'');

            const filtered = useMemo(() => {
                let d = dishes.filter(d=>d.category===filter);
                if (dietaryFilter !== 'all') d = d.filter(d=>d.dietary===dietaryFilter);
                return d.sort((a,b)=>{ const idxA=categoryOrder.indexOf(a.category); const idxB=categoryOrder.indexOf(b.category); return idxA-idxB; });
            }, [filter, dietaryFilter, dishes]);
            useEffect(() => { setLoading(true); const t=setTimeout(()=>setLoading(false), 300); return ()=>clearTimeout(t); }, [filter, dietaryFilter]);
            return (
                <section id="menu" className="py-24 bg-soft-beige dark:bg-dark-chocolate/60 px-6">

                        </div>
                        <div className="flex justify-center gap-3 mb-10">
                            <button onClick={()=>setDietaryFilter('all')} className={`px-4 py-1 rounded-full text-sm font-medium transition active:scale-95 ${dietaryFilter==='all'?'bg-accent-secondary text-dark-chocolate':'bg-white dark:bg-dark-chocolate'}`}>{t.dietary}: All</button>
                            <button onClick={()=>setDietaryFilter('veg')} className={`px-4 py-1 rounded-full text-sm font-medium transition active:scale-95 ${dietaryFilter==='veg'?'bg-green-500 text-white':'bg-white dark:bg-dark-chocolate'}`}>🥬 {t.veg}</button>

        const SignatureDishes = ({ t, specials, onOrder }) => (<section className="py-24 px-6"><h2 className="font-display text-4xl font-bold text-center mb-10">Chef's <span className="italic text-velvet-red">Specials</span></h2><div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8 max-w-7xl mx-auto">{specials.map(dish=>(<div key={dish.id} className="glass-card rounded-2xl overflow-hidden float-frame"><div className="image-hover-zoom h-64"><img src={dish.image} className="w-full h-full object-cover" loading="lazy" alt={dish.title} /></div><div className="p-6"><h3 className="menu-item-title font-bold text-xl">{dish.title}</h3><p className="text-velvet-red font-bold text-lg">₹{dish.price}</p><button onClick={()=>onOrder(dish)} className="add-to-cart-btn mt-3 px-4 py-2 rounded-full text-sm font-semibold active:scale-95">{t.orderNow}</button></div></div>))}</div></section>);

        const AISuggester = ({ t, dishes, onClose }) => {

            const startVoice = () => { if (recognitionRef.current) { setListening(true); recognitionRef.current.start(); } };
            const handleSuggest = () => { if (!category || category === 'all') setResults(dishes.slice(0,8)); else setResults(dishes.filter(d => d.category.toLowerCase().includes(category))); };
            return (

                        </div>
                        {results.length>0 && <div className="mt-4 space-y-2 max-h-48 overflow-auto">{results.map(dish=>(<div key={dish.id} className="flex gap-3 items-center p-2 glass-card rounded-xl"><img src={dish.image} className="w-12 h-12 rounded-lg object-cover" /><div><div className="font-semibold">{dish.title}</div><div className="text-xs">₹{dish.price}</div></div></div>))}</div>}
                    </div>
                </div>
            );
        };

        // ===================== MAIN APP (CUSTOMER-FACING) =====================
        const MainApp = ({ t, darkMode, toggleDarkMode, onSignOut, requestLogin, weatherGreeting, userName, userId, dishes, setDishes, allOrders, setAllOrders, discountCodes, onAdminClick, settings }) => {
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [cartOpen, setCartOpen] = useState(false);
            const [customizeModal, setCustomizeModal] = useState(null);
            const [showAI, setShowAI] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [featureModal, setFeatureModal] = useState(null);
            const [orders, setOrders] = useState(() => LS.get(`ck_orders_${userId}`, []));
            const [favorites, setFavorites] = useState(() => LS.get(`ck_fav_${userId}`, []));

            const [cartItems, setCartItems] = useState([]);
            const [checkoutActive, setCheckoutActive] = useState(false);
            const [trackingOrder, setTrackingOrder] = useState(null);
            const [dietaryFilter, setDietaryFilter] = useState('all');
            const [fulfillmentMode, setFulfillmentMode] = useState('delivery');
            const [selectedAddress, setSelectedAddress] = useState({ id:'addr1', label:'Home', address:'123, MG Road, Indiranagar, Bangalore 560038', eta:'25-35 mins' });
            const [addressSheetOpen, setAddressSheetOpen] = useState(false);
            const [paymentMode, setPaymentMode] = useState('online');
            const [selectedPaymentMethod, setSelectedPaymentMethod] = useState(null);
            const [redeemPoints, setRedeemPoints] = useState(0);
            const [isProcessing, setIsProcessing] = useState(false);
            const [cartBounce, setCartBounce] = useState(false);
            const [discountCodeInput, setDiscountCodeInput] = useState('');
            const [discountPercent, setDiscountPercent] = useState(0);

            const savedAddresses = [{ id:'addr1', label:'Home', address:'123, MG Road, Indiranagar, Bangalore 560038', eta:'25-35 mins' },{ id:'addr2', label:'Work', address:'456, Koramangala 5th Block, Bangalore 560034', eta:'30-40 mins' }];

            useEffect(() => { const user = LS.get('ck_users', {})[userId]; if (user) setCoins(user.loyalty_coins); }, [userId]);
            useEffect(() => { LS.set(`ck_orders_${userId}`, orders); }, [orders, userId]);
            useEffect(() => { LS.set(`ck_fav_${userId}`, favorites); }, [favorites, userId]);

            const notify = (msg) => { const id = Date.now(); setToasts(prev => [...prev, { id, msg }]); setTimeout(() => setToasts(prev => prev.filter(toast => toast.id !== id)), 3000); };
            const requestNotificationPermission = async () => { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); };

            const addToCart = (dish, customizations, finalPrice) => {
                setCartItems(prev => { const existing = prev.find(i => i.sku === dish.id && i.customizations === customizations); if (existing) return prev.map(i => i.sku === dish.id && i.customizations === customizations ? { ...i, qty: i.qty + 1 } : i); return [...prev, { sku: dish.id, name: dish.title, image: dish.image, unitPrice: finalPrice, qty: 1, customizations: customizations || 'Standard' }]; });
                setCartBounce(true); setTimeout(() => setCartBounce(false), 400);
                notify(`${dish.title} added`);
                requestNotificationPermission();
            };
            const updateQuantity = (sku, delta, customKey) => { setCartItems(prev => prev.map(i => (i.sku === sku && i.customizations === customKey) ? { ...i, qty: Math.max(1, i.qty + delta) } : i)); };
            const removeItem = (sku, customKey) => { setCartItems(prev => prev.filter(i => !(i.sku === sku && i.customizations === customKey))); };

            const itemTotal = cartItems.reduce((s, i) => s + i.unitPrice * i.qty, 0);
            const proceedToCheckout = () => { if (!userId) { requestLogin(); return; } setCartOpen(false); setCheckoutActive(true); };
            const deliveryFee = fulfillmentMode === 'pickup' ? 0 : (itemTotal >= 300 ? 0 : 40);
            const platformFee = 10;
            const taxRate = 0.05;
            const taxAmount = Math.round((itemTotal + deliveryFee + platformFee) * taxRate);
            const loyaltyDiscount = redeemPoints;
            const totalDiscount = loyaltyDiscount + Math.round(itemTotal * discountPercent / 100);
            const grandTotal = Math.max(0, itemTotal + deliveryFee + platformFee + taxAmount - totalDiscount);

            const applyDiscountCode = () => {
                const code = discountCodeInput.trim().toUpperCase();
                const percent = discountCodes[code];
                if (percent) {
                    setDiscountPercent(percent);
                    notify(`Discount code applied: ${percent}% off`);
                } else {
                    notify('Invalid discount code');
                }
            };

            const handlePlaceOrder = async () => {
                if (!selectedPaymentMethod || !userId) return;
                setIsProcessing(true);
                await new Promise(r => setTimeout(r, 800));
                const order = {
                    id: Date.now(),
                    customer: { name: userName, phone: userId },
                    items: cartItems.map(i => ({ name: i.name, image: i.image, unitPrice: i.unitPrice, qty: i.qty, customizations: i.customizations })),
                    total: itemTotal,
                    eta: fulfillmentMode === 'delivery' ? '25-35 mins' : '15-20 mins',
                    created_at: new Date().toISOString(),
                    status: 'Processing'
                };
                setOrders(prev => [order, ...prev]);
                setAllOrders(prev => [order, ...prev]);
                const users = LS.get('ck_users', {});
                const user = users[userId];
                if (user) {
                    user.loyalty_coins = user.loyalty_coins - redeemPoints + 10;

                setRedeemPoints(0);
                setDiscountCodeInput('');
                setDiscountPercent(0);

                            </div>
                        </header>
                        <main className="max-w-lg mx-auto px-4 py-6 pb-24">

                            {cartItems.length === 0 ? <div className="text-center py-12"><p>Cart empty</p></div> : <>
                                <AddressBar address={selectedAddress} fulfillmentMode={fulfillmentMode} onEditAddress={() => setAddressSheetOpen(true)} onChangeFulfillment={setFulfillmentMode} />
                                <div className="mb-4 space-y-2">{cartItems.map(item => <CartItemRow key={item.sku + item.customizations} item={item} onIncrement={(sku, c) => updateQuantity(sku, 1, c)} onDecrement={(sku, c) => updateQuantity(sku, -1, c)} onRemove={removeItem} />)}</div>
                                <div className="mb-4">
                                    <label className="block text-sm font-bold mb-2">{t.discountCode}</label>
                                    <div className="flex gap-2">
                                        <input type="text" value={discountCodeInput} onChange={e => setDiscountCodeInput(e.target.value)} className="flex-1 p-2 rounded-xl border" placeholder="Enter code" />
                                        <button onClick={applyDiscountCode} className="px-4 py-2 bg-velvet-red text-white rounded-xl active:scale-95">{t.apply}</button>
                                    </div>
                                </div>
                                <BillSplitCard t={t} itemTotal={itemTotal} deliveryFee={deliveryFee} platformFee={platformFee} taxRate={taxRate} discount={totalDiscount} loyaltyPointsRedeemed={redeemPoints} onRedeemPoints={setRedeemPoints} availablePoints={coins} />
                                <PaymentMethodSelector paymentMode={paymentMode} onPaymentModeChange={setPaymentMode} selectedMethod={selectedPaymentMethod} onSelectMethod={setSelectedPaymentMethod} fulfillmentMode={fulfillmentMode} />
                                <StickyBottomCTA t={t} grandTotal={grandTotal} isProcessing={isProcessing} disabled={!selectedPaymentMethod} onPlaceOrder={handlePlaceOrder} />
                            </>}
                        </main>
                    </div>
                );
            }

            window.__globalDishes = dishes;
            const specials = dishes.filter(d => specialsTitles.includes(d.title));
            const menuDishes = dishes.filter(d => !specialsTitles.includes(d.title));

            return (
                <div className="relative">
                    <FloatingItems />

                                <button onClick={() => setSidebarOpen(true)} className="p-2 rounded-full glass-card focus:outline-none" aria-label="Menu">
                                    <div className="hamburger-icon"><span className="hamburger-line"></span><span className="hamburger-line"></span><span className="hamburger-line"></span></div>
                                </button>
                                <a href="#hero" className="font-display text-2xl font-bold">CLOUD KITCHEN<span className="text-red-velvet">.</span></a>

                                </button>

        // ===================== APP ROOT =====================
        const App = () => {

            const t = translations.en;

            useEffect(() => { document.documentElement.classList.toggle('dark', darkMode); }, [darkMode]);
            useEffect(() => {
                const phone = LS.get('ck_currentUser');
                if (phone) {
                    const users = LS.get('ck_users', {});
                    const user = users[phone];
                    if (user) { setUserId(phone); setUserName(user.name); setAuthenticated(true); }
                }
                setLoading(false);
            }, []);
            useEffect(() => { LS.set('ck_dishes', dishes); }, [dishes]);
            useEffect(() => { LS.set('ck_all_orders', allOrders); }, [allOrders]);
            useEffect(() => { LS.set('ck_discounts', discountCodes); }, [discountCodes]);
            useEffect(() => { LS.set('ck_settings', settings); }, [settings]);

            const handleSkip = () => { setAuthenticated(true); setUserName('Guest'); setUserId(null); setLoginRequested(false); };
            const handleLogin = () => {
                const phone = LS.get('ck_currentUser');
                if (phone) { const users = LS.get('ck_users', {}); const user = users[phone]; if (user) { setUserId(phone); setUserName(user.name); setAuthenticated(true); } }
                setLoginRequested(false);
            };
            const requestLogin = () => { setLoginRequested(true); };
            const handleSignOut = () => { LS.remove('ck_currentUser'); setAuthenticated(false); setUserName('Guest'); setUserId(null); };
            const openAdmin = () => setAdminOpen(true);
            const closeAdmin = () => setAdminOpen(false);

            if (loading) return <LoadingScreen t={t} onComplete={() => setLoading(false)} bgImage={settings.loaderBg} />;
            if (adminOpen) return <AdminPanel dishes={dishes} setDishes={setDishes} orders={allOrders} setOrders={setAllOrders} discountCodes={discountCodes} setDiscountCodes={setDiscountCodes} settings={settings} setSettings={setSettings} onCloseAdmin={closeAdmin} />;
            if (loginRequested) return <AuthScreen t={t} onLogin={handleLogin} onSkip={handleSkip} setUserName={setUserName} />;
            if (!authenticated) return <AuthScreen t={t} onLogin={handleLogin} onSkip={handleSkip} setUserName={setUserName} />;
            return (
                <LangContext.Provider value={{ t }}>
                    <Cursor />
                    <MainApp
                        t={t} darkMode={darkMode} toggleDarkMode={() => setDarkMode(!darkMode)}
                        onSignOut={handleSignOut} requestLogin={requestLogin} weatherGreeting=""
                        userName={userName} userId={userId}
                        dishes={dishes} setDishes={setDishes}
                        allOrders={allOrders} setAllOrders={setAllOrders}
                        discountCodes={discountCodes}
                        onAdminClick={openAdmin}
                        settings={settings}
                    />
                </LangContext.Provider>
            );
        };

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swBlob = new Blob([`
                    const CACHE_NAME = 'ck-v2';
                    self.addEventListener('install', e => { e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['/'])).then(()=>self.skipWaiting())); });
                    self.addEventListener('fetch', e => { e.respondWith(caches.match(e.request).then(resp=>resp||fetch(e.request))); });
                `], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl);
            });
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
